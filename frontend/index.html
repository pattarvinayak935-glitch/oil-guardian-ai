<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OIL Guardian AI - Enterprise Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #070b14; color: #e2e8f0; overflow-x: hidden; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes ping-slow { 0% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.4); opacity: 0.2; } 100% { transform: scale(1.8); opacity: 0; } }
    .animate-ping-slow { animation: ping-slow 2.4s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes rotate-radar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-rotate { animation: rotate-radar 6s linear infinite; }
    .fade-out { opacity: 0; transform: scale(1.05); transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
    .fade-in { opacity: 1; transform: translateY(0); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative selection:bg-orange-500/30">

  <!-- Background Ambient Glows -->
  <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-orange-600/10 blur-[130px] pointer-events-none"></div>
  <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-blue-600/10 blur-[130px] pointer-events-none"></div>

  <!-- Splash Intro Animation Screen -->
  <div id="splashScreen" class="fixed inset-0 z-50 bg-[#070b14] flex flex-col items-center justify-center text-center px-4 transition-all">
    <div class="relative flex items-center justify-center w-48 h-48 mb-8">
      <div class="absolute inset-0 rounded-full border border-orange-500/30 animate-ping-slow"></div>
      <div class="absolute inset-4 rounded-full border border-orange-500/20 animate-ping-slow" style="animation-delay: 0.6s;"></div>
      <div class="absolute inset-2 rounded-full border-2 border-dashed border-orange-500/40 animate-rotate"></div>
      <div class="relative z-10 w-24 h-24 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-3xl flex items-center justify-center shadow-[0_0_35px_rgba(234,88,12,0.5)] border border-orange-400/30">
        <i class="fa-solid fa-shield-halved text-4xl text-white drop-shadow-md"></i>
      </div>
    </div>
    <h2 class="text-3xl font-black tracking-tight text-white flex items-center gap-2">
      <span>OIL GUARDIAN</span>
      <span class="px-2 py-0.5 rounded-lg bg-orange-600 text-white text-xs mono tracking-wider font-bold shadow-[0_0_15px_rgba(234,88,12,0.6)]">AI</span>
    </h2>
    <p class="text-xs font-semibold tracking-widest text-slate-400 uppercase mt-2">SIH26165 · Precursor Detection Hub</p>
    <div class="w-64 max-w-full mt-8">
      <div class="w-full bg-slate-800/50 h-1.5 rounded-full overflow-hidden border border-slate-700/50">
        <div id="splashProgress" class="bg-gradient-to-r from-orange-500 to-amber-400 h-full rounded-full transition-all duration-300 w-0 shadow-[0_0_10px_rgba(245,158,11,0.8)]"></div>
      </div>
      <div class="flex justify-between items-center mt-2.5">
        <span id="splashStatusText" class="text-[11px] mono text-slate-400">Verifying Security Protocols...</span>
        <span id="splashPercent" class="text-[11px] mono font-bold text-orange-400">0%</span>
      </div>
    </div>
    <button onclick="endSplashAnimation()" class="mt-6 text-[11px] text-slate-500 hover:text-slate-300 font-semibold underline underline-offset-4 transition-colors">Skip intro →</button>
  </div>

  <!-- Login Card (Matches Exact Screenshot Styling) -->
  <div id="loginCard" class="opacity-0 translate-y-6 max-w-md w-full bg-[#0d1424]/90 backdrop-blur-2xl rounded-3xl border border-slate-700/40 shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden relative z-10 transition-all duration-500">
    
    <div class="p-8 text-center border-b border-slate-800/80 bg-slate-900/30">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-600 to-amber-500 text-white rounded-2xl shadow-[0_0_30px_rgba(234,88,12,0.4)] mb-4 border border-orange-400/30">
        <i class="fa-solid fa-shield-halved text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">OIL Guardian AI</h1>
      <p class="text-xs font-semibold text-orange-500 tracking-widest uppercase mt-1">SIH26165 · OPERATIONS HUB</p>
    </div>

    <div class="p-8">
      <!-- Role Toggle Tabs (Employee Active by Default) -->
      <div class="grid grid-cols-2 p-1.5 bg-[#141e33] rounded-2xl mb-6 border border-slate-700/40">
        <button id="tabEmployee" onclick="switchTab('employee')" class="py-2.5 text-xs font-bold rounded-xl transition-all shadow-md bg-[#1e293b] border border-slate-600 text-orange-400 flex items-center justify-center gap-2">
          <i class="fa-solid fa-hard-hat"></i> Employee / Rig
        </button>
        <button id="tabOfficer" onclick="switchTab('officer')" class="py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white flex items-center justify-center gap-2 bg-transparent border border-transparent">
          <i class="fa-solid fa-user-shield"></i> Safety Officer
        </button>
      </div>

      <!-- Employee Login Form (FACILITY REMOVED, PASSWORD ADDED) -->
      <form id="formEmployee" onsubmit="handleLogin(event, 'employee')" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">BADGE ID</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">
              <i class="fa-solid fa-id-badge"></i>
            </span>
            <input type="text" id="empId" value="oil-79655" required class="w-full pl-10 pr-3.5 py-3 bg-[#11192e] border border-slate-700/80 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">PASSWORD</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="empPass" value="••••••••" required class="w-full pl-10 pr-3.5 py-3 bg-[#11192e] border border-slate-700/80 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
          </div>
        </div>

        <button type="submit" class="w-full mt-2 py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl shadow-[0_0_20px_rgba(234,88,12,0.4)] text-sm flex items-center justify-center gap-2 transition-all">
          <span>Enter Employee Portal</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Safety Officer Login Form -->
      <form id="formOfficer" onsubmit="handleLogin(event, 'officer')" class="space-y-4 hidden">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">OFFICER EMAIL</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="text" id="officerId" value="hse@oilindia.in" required class="w-full pl-10 pr-3.5 py-3 bg-[#11192e] border border-slate-700/80 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">SECURITY PASSCODE</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">
              <i class="fa-solid fa-shield-keyhole"></i>
            </span>
            <input type="password" value="••••••••" required class="w-full pl-10 pr-3.5 py-3 bg-[#11192e] border border-slate-700/80 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
          </div>
        </div>

        <button type="submit" class="w-full mt-2 py-3.5 bg-white hover:bg-slate-200 text-slate-900 font-bold rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.2)] text-sm flex items-center justify-center gap-2 transition-all">
          <span>Access Safety Console</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Evaluator Demo Direct Access -->
      <div class="mt-8 pt-6 border-t border-slate-800 text-center">
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3">Evaluator Quick Switch</p>
        <div class="flex gap-2">
          <button onclick="quickLogin('employee')" class="flex-1 py-2 px-3 bg-orange-500/10 border border-orange-500/30 text-orange-400 text-xs font-semibold rounded-xl hover:bg-orange-500/20 transition-all">
            <i class="fa-solid fa-hard-hat mr-1"></i> Field Demo
          </button>
          <button onclick="quickLogin('officer')" class="flex-1 py-2 px-3 bg-slate-800/80 border border-slate-700 text-slate-300 text-xs font-semibold rounded-xl hover:bg-slate-700 transition-all">
            <i class="fa-solid fa-user-shield mr-1"></i> Officer Demo
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const splashStages = [
      { progress: 25, text: "Connecting to OIL India HSE Gateways..." },
      { progress: 55, text: "Loading BERT & NLP Classifiers..." },
      { progress: 85, text: "Synchronizing IOGP Safety Rules..." },
      { progress: 100, text: "Security Handshake Verified." }
    ];
    let currentStage = 0;

    function runSplashSequence() {
      const progressBar = document.getElementById('splashProgress');
      const statusText = document.getElementById('splashStatusText');
      const percentText = document.getElementById('splashPercent');
      const interval = setInterval(() => {
        if (currentStage < splashStages.length) {
          const step = splashStages[currentStage];
          progressBar.style.width = step.progress + "%";
          percentText.innerText = step.progress + "%";
          statusText.innerText = step.text;
          currentStage++;
        } else {
          clearInterval(interval);
          setTimeout(endSplashAnimation, 400);
        }
      }, 450);
    }

    function endSplashAnimation() {
      const splash = document.getElementById('splashScreen');
      const loginCard = document.getElementById('loginCard');
      splash.classList.add('fade-out');
      setTimeout(() => {
        splash.style.display = 'none';
        loginCard.classList.remove('opacity-0', 'translate-y-6');
        loginCard.classList.add('fade-in');
      }, 650);
    }
    window.addEventListener('DOMContentLoaded', runSplashSequence);

    function switchTab(role) {
      const tabEmp = document.getElementById('tabEmployee');
      const tabOff = document.getElementById('tabOfficer');
      const formEmp = document.getElementById('formEmployee');
      const formOff = document.getElementById('formOfficer');
      if (role === 'employee') {
        tabEmp.className = "py-2.5 text-xs font-bold rounded-xl transition-all shadow-md bg-[#1e293b] border border-slate-600 text-orange-400 flex items-center justify-center gap-2";
        tabOff.className = "py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white flex items-center justify-center gap-2 bg-transparent border border-transparent";
        formEmp.classList.remove('hidden'); formOff.classList.add('hidden');
      } else {
        tabOff.className = "py-2.5 text-xs font-bold rounded-xl transition-all shadow-md bg-[#1e293b] border border-slate-600 text-orange-400 flex items-center justify-center gap-2";
        tabEmp.className = "py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white flex items-center justify-center gap-2 bg-transparent border border-transparent";
        formOff.classList.remove('hidden'); formEmp.classList.add('hidden');
      }
    }

    function handleLogin(e, role) {
      e.preventDefault();
      localStorage.setItem('oil_active_role', role);
      if (role === 'employee') {
        localStorage.setItem('oil_user_id', document.getElementById('empId').value);
        window.location.href = 'employee.html';
      } else {
        localStorage.setItem('oil_user_id', 'Safety Officer (HSE-Lead)');
        window.location.href = 'officer.html';
      }
    }

    function quickLogin(role) {
      localStorage.setItem('oil_active_role', role);
      if (role === 'employee') {
        localStorage.setItem('oil_user_id', 'oil-79655');
        window.location.href = 'employee.html';
      } else {
        localStorage.setItem('oil_user_id', 'Safety Officer (HSE-Lead)');
        window.location.href = 'officer.html';
      }
    }
  </script>
</body>
</html>
